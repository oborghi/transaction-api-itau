services:
  # --- Infraestrutura ---
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    hostname: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: transaction_db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  localstack:
    image: localstack/localstack:3.7.2
    hostname: localstack
    container_name: localstack
    user: root
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SERVICES=sqs,secretsmanager,ssm,cloudwatch,xray
      - SKIP_SSL_CERT_DOWNLOAD=1
      - DISABLE_EVENTS=1
      - XRAY_ENABLED=1
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    volumes:
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  message-generator:
    image: golang:1.24.3
    container_name: message-generator
    depends_on:
      localstack:
        condition: service_healthy
        restart: true
    environment:
      - QUEUE_NAME=conta-bancaria-criada
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - TOTAL_ACCOUNTS=100000
      - GOPROXY=https://proxy.golang.org
      - GOSUMDB=sum.golang.org
    command: >
      /bin/sh -c "
        openssl s_client -showcerts -connect proxy.golang.org:443 </dev/null 2>/dev/null |
          awk '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/ { print $0 }' > /usr/local/share/ca-certificates/ca_bundle.crt &&
        update-ca-certificates &&
        rm -rf /tmp/go && mkdir -p /tmp/go && cd /tmp/go &&
        echo [base64 encoded go source] | base64 -d > message-generator.go &&
        go clean -modcache &&
        go mod init message-generator &&
        go mod tidy &&
        go mod download &&
        go run message-generator.go
      "
    working_dir: /home

  # --- Aplicação ---
  transaction-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/transaction_db?authSource=admin
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/conta-bancaria-criada
      SQS_DLQ_URL: http://localstack:4566/000000000000/conta-bancaria-criada-dlq
      SQS_POLL_INTERVAL: 5000
      JWT_EXPIRATION: 86400
      API_CLIENT_ID: transaction-api-client
      API_CLIENT_SECRET: super-secret-key-123
      API_READONLY_ID: transaction-api-readonly
      API_READONLY_SECRET: super-secret-key-123
      AWS_SECRETS_ENABLED: "true"
      CLOUDWATCH_ENABLED: "true"
      CLOUDWATCH_NAMESPACE: TransactionAPI
      ACTUATOR_EXPOSURE: health,info,metrics
      LOG_LEVEL: INFO
      LOG_LEVEL_MONGODB: WARN
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s