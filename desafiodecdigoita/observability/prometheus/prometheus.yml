global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'transaction-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transaction-api:8080']
        labels:
          app: 'transaction-api'
          environment: 'local'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']