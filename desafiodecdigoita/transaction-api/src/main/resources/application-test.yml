spring:
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/transaction_db?authSource=admin
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
    cache-names:
      - jwt-tokens

# Fixed JWT secrets for test profile (no DynamicPropertySource needed)
app:
  security:
    jwt:
      secret: IntegrationTestSecretKeyForTestingOnly2024!
      expiration: 86400
      issuer: transaction-api-test
    clients:
      - id: transaction-api-client
        secret: super-secret-key-123
        roles: [ADMIN, API]
  sqs:
    queue-url: ""
    dlq-url: ""
    poll-interval: 1000

aws:
  endpoint-url: http://localhost:4566
  region: sa-east-1
  access-key-id: test
  secret-access-key: test

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

resilience4j:
  circuitbreaker:
    metrics:
      enabled: true

logging:
  level:
    com.itau.transaction: DEBUG