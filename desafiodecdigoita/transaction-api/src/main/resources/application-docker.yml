# ==========================================
# Docker Profile - Docker Compose Environment
# ==========================================
# Activated via: SPRING_PROFILES_ACTIVE=docker
# Uses Docker Compose service names for inter-container networking:
#   - MongoDB → mongodb container
#   - SQS → localstack container
#   - Secrets → Vault container (dev mode)
#   - Config → Consul container (dev mode)
# ==========================================

spring:
  data:
    mongodb:
      # Overridden by Vault at startup if Vault is available
      uri: mongodb://admin:admin123@mongodb:27017/transaction_db?authSource=admin

# AWS (LocalStack container)
aws:
  endpoint-url: http://localstack:4566
  region: sa-east-1
  access-key-id: test
  secret-access-key: test

# SQS (LocalStack container)
app:
  sqs:
    queue-url: http://localstack:4566/000000000000/conta-bancaria-criada
    dlq-url: http://localstack:4566/000000000000/conta-bancaria-criada-dlq
    poll-interval: 5000
  security:
    jwt:
      # Overridden by Vault at startup
      secret: changeme
      expiration: 86400
      issuer: transaction-api
    clients:
      # Overridden by Vault at startup
      - id: transaction-api-client
        secret: changeme
        roles: [ADMIN, API]
      - id: transaction-api-readonly
        secret: changeme
        roles: [API]

# Consul (disabled in Docker - secrets loaded via VaultSecretLoader)
spring.cloud:
  consul:
    config:
      enabled: false
    discovery:
      enabled: false

# Vault (disabled as Spring Cloud Vault - using custom VaultSecretLoader instead)
# VaultSecretLoader runs as EnvironmentPostProcessor and loads secrets via HTTP
spring.cloud.vault:
  enabled: false

# Custom Vault integration (VaultSecretLoader EnvironmentPostProcessor)
app.vault:
  enabled: true
  host: ${VAULT_HOST:vault}
  port: ${VAULT_PORT:8200}
  scheme: http
  token: ${VAULT_TOKEN:root-token}

# AWS Secrets Manager (disabled in Docker - using Vault)
app.secrets:
  aws:
    enabled: false