# ==========================================
# Transaction API - Single Configuration
# ==========================================
# Toda a configuração é feita via variáveis de ambiente.
# Não há mais profiles Spring - apenas um arquivo único.
#
# Scripts de ambiente disponíveis:
#   source scripts/env-local.sh   → Desenvolvimento local
#   source scripts/env-docker.sh  → Docker Compose
#   source scripts/env-aws.sh     → Produção AWS
# ==========================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: transaction-api
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
    cache-names:
      - jwt-tokens
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}

# ==========================================
# AWS Configuration
# ==========================================
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:}
  region: ${AWS_DEFAULT_REGION:sa-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

# ==========================================
# App Configuration
# ==========================================
# All security credentials are loaded exclusively from AWS Secrets Manager
# via SecretsManagerLoader (EnvironmentPostProcessor).
# No fallback defaults are defined here for security reasons.
# See: transaction-api/jwt, transaction-api/credentials secrets in AWS/LocalStack
app:
  security:
    jwt:
      secret: placeholder-overridden-by-secrets-manager
      expiration: ${JWT_EXPIRATION:86400}
      issuer: transaction-api
    clients:
      - id: placeholder-overridden-by-secrets-manager
        secret: placeholder-overridden-by-secrets-manager
        roles: [ADMIN, API]
      - id: placeholder-overridden-by-secrets-manager
        secret: placeholder-overridden-by-secrets-manager
        roles: [API]
  sqs:
    queue-url: ${SQS_QUEUE_URL:}
    dlq-url: ${SQS_DLQ_URL:}
    poll-interval: ${SQS_POLL_INTERVAL:5000}
  dlq:
    reprocessor:
      enabled: true
      interval: PT5M
      max-batch-size: 10

# ==========================================
# Resilience4j
# ==========================================
resilience4j:
  circuitbreaker:
    instances:
      mongoDb:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      sqsCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      dlqReprocessorCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
  retry:
    instances:
      mongoDbRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
          - com.mongodb.MongoException

# ==========================================
# Actuator + CloudWatch Metrics
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:health,info,metrics}
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      cloudwatch:
        enabled: ${CLOUDWATCH_ENABLED:false}
        namespace: ${CLOUDWATCH_NAMESPACE:TransactionAPI}
        batch-size: 20
        step: 30s

# ==========================================
# Logging
# ==========================================
logging:
  level:
    com.itau.transaction: ${LOG_LEVEL:INFO}
    org.springframework.data.mongodb: ${LOG_LEVEL_MONGODB:WARN}