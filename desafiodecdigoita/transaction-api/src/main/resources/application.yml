# ==========================================
# Base Configuration (shared across all profiles)
# ==========================================
# Profile-specific configs:
#   application-local.yml  → Local development (Docker: MongoDB, LocalStack, Vault)
#   application-docker.yml → Docker Compose environment
#   application-aws.yml    → AWS production (DocumentDB, SQS, Secrets Manager)
#   application-test.yml   → Integration tests
#
# Activate via: SPRING_PROFILES_ACTIVE=local|docker|aws|test
# ==========================================

server:
  port: 8080

spring:
  application:
    name: transaction-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
    cache-names:
      - jwt-tokens

# ==========================================
# AWS (defaults - overridden per profile)
# ==========================================
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:}
  region: ${AWS_DEFAULT_REGION:sa-east-1}

# ==========================================
# App Configuration (defaults - overridden per profile)
# ==========================================
app:
  security:
    jwt:
      secret: ${JWT_SECRET:changeme}
      expiration: ${JWT_EXPIRATION:86400}
      issuer: transaction-api
    clients:
      - id: ${API_CLIENT_ID:transaction-api-client}
        secret: ${API_CLIENT_SECRET:changeme}
        roles: [ADMIN, API]
      - id: ${API_READONLY_ID:transaction-api-readonly}
        secret: ${API_READONLY_SECRET:changeme}
        roles: [API]
  sqs:
    queue-url: ${SQS_QUEUE_URL:}
    dlq-url: ${SQS_DLQ_URL:}
    poll-interval: ${SQS_POLL_INTERVAL:5000}
  secrets:
    aws:
      enabled: ${AWS_SECRETS_ENABLED:false}
  dlq:
    reprocessor:
      enabled: true
      interval: PT5M
      max-batch-size: 10

# ==========================================
# Resilience4j (shared across all profiles)
# ==========================================
resilience4j:
  circuitbreaker:
    instances:
      mongoDbCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      sqsCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      dlqReprocessorCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
  retry:
    instances:
      mongoDbRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
          - com.mongodb.MongoException

# ==========================================
# Actuator (shared across all profiles)
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ==========================================
# Consul (disabled by default, enabled in docker profile)
# ==========================================
spring.cloud:
  consul:
    host: ${CONSUL_HOST:localhost}
    port: ${CONSUL_PORT:8500}
    config:
      enabled: false
    discovery:
      enabled: false

# ==========================================
# Vault (disabled by default, enabled in docker profile)
# ==========================================
spring.cloud.vault:
  enabled: false
  host: localhost
  port: 8200
  scheme: http
  authentication: TOKEN
  token: root-token
  kv:
    enabled: true
    backend: secret
    default-context: transaction-api
    application-name: transaction-api

# ==========================================
# Logging (defaults - overridden per profile)
# ==========================================
logging:
  level:
    com.itau.transaction: INFO
    org.springframework.data.mongodb: WARN